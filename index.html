<script>

 ['Konsolidasi hasil',[A('Konsolidasi seluruh tim','2026-10-30','2026-11-02','Seluruh Tim Penilai','Hasil terkonsolidasi'),A('Draft laporan hasil','2026-11-02','2026-11-04','Tim Penilai','Draft laporan')]],

 return{n:u+10,ts:0,ph:P.map((p,i)=>({id:100+i,t:p[0],c:PAL[i],acts:p[1]}))}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.ph)S=seed();

 stat('Menyimpan…');clearTimeout(tmr);tmr=setTimeout(()=>ref.set({json:JSON.stringify(S)}).then(()=>stat('Tersimpan di server.')).catch(e=>stat('Gagal menyimpan: '+(e.code||e.message))),500)}
if(fbOn){firebase.initializeApp(FB);auth=firebase.auth();ref=firebase.firestore().doc('timeline/pipk');
 ref.onSnapshot(sn=>{if(sn.metadata.hasPendingWrites||!sn.exists)return;const a=document.activeElement;if(a&&a.tagName=='INPUT'&&a.closest('#app'))return;
  try{const r=JSON.parse(sn.data().json);if(r&&r.ph){S=r;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();stat('Data terbaru dari server.')}}catch(e){}},e=>stat('Gagal membaca data: '+(e.code||e.message)));
 auth.onAuthStateChanged(u=>{user=u;if(!u)edit=false;showLogin=false;render()})}
else stat('Mode lokal: Firebase belum dikonfigurasi, perubahan hanya tersimpan di peramban ini.');

function build(){let mn=null,mx=null;allA().forEach(a=>{if(!mn||a.sd<mn)mn=a.sd;if(!mx||a.ed>mx)mx=a.ed});if(!mn){mn='2026-10-01';mx=TARGET}
 days=[];for(let d=D(mn),e=D(mx);d<=e;d.setDate(d.getDate()+1))if(d.getDay()%6)days.push(new Date(d));n=days.length;
 const ix=s=>Math.max(0,days.findIndex(d=>iso(d)===s));allA().forEach(a=>{a.s=ix(a.sd);a.e=ix(a.ed)});today=days.findIndex(d=>iso(d)===iso(new Date()))}

 let f=focus!==null?fA(focus):null;if(!f)focus=null;if(pf!==null&&!S.ph.some(p=>p.id===pf))pf=null;

 let ws=0,we=n-1;if(f){ws=Math.max(0,f.a.s-2);we=Math.min(n-1,f.a.e+2);while(we-ws<5&&n>6){if(ws>0)ws--;if(we<n-1)we++}}
 const nc=we-ws+1,zoom=nc<=16,dense=nc>34,LW=edit?280:190,hi={};(f?[f]:vis.map(a=>fA(a.id))).forEach(r=>{hi[r.a.s]=r.p.c;hi[r.a.e]=r.p.c});
 let tot=0,sel=0,run=0;allA().forEach(a=>{tot++;a.st==2&&sel++;a.st==1&&run++});const pct=tot?Math.round(sel/tot*100):0;
 let endT='–',endS='',endC='var(--mut)';if(n){const e=days[n-1];endT=e.getDate()+' '+MS[e.getMonth()];if(iso(e)<=TARGET){endS='sesuai target 13 Nov 2026';endC='var(--gn)'}else{endS='melewati target 13 Nov ('+days.filter(d=>iso(d)>TARGET).length+' hari kerja)';endC='var(--rd)'}}
 let h='<div class="cards"><div class="mc"><p>Kegiatan</p><b>'+tot+'</b> <span class="sub">dalam '+S.ph.length+' tahap</span></div><div class="mc"><p>Progres</p><b>'+pct+'%</b> <span class="sub">'+sel+' dari '+tot+' selesai, '+run+' berjalan</span><div class="mt"><i style="width:'+pct+'%"></i></div></div><div class="mc"><p>Akhir rangkaian</p><b>'+endT+'</b> <span class="sub" style="color:'+endC+'">'+endS+'</span></div></div>';
 h+='<div class="bar"><button data-a="pf" data-v="" class="'+(pf===null?'on':'')+'">Semua tahap</button>'+S.ph.map((p,k)=>'<button data-a="pf" data-v="'+p.id+'" class="'+(pf===p.id?'on':'')+'">'+ROM[k]+'. '+esc(p.t)+'</button>').join('')+'<span class="sp"></span>'+acct()+'</div>';
 if(showLogin&&!user)h+='<div class="bar"><input id="em" type="email" placeholder="Email admin" autocomplete="username"><input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password"><button data-a="dologin">Masuk</button></div>';
 if(edit)h+='<div class="bar"><button data-a="addp">+ Tambah tahap</button><button data-a="reset" class="'+(pend=='reset'?'dg':'')+'">'+(pend=='reset'?'Yakin kembalikan jadwal awal?':'Kembalikan jadwal awal')+'</button><span class="sub" id="nt">Ubah nama atau tanggal langsung pada daftar; akhir pekan disesuaikan ke hari kerja.</span></div>';
 h+='<div class="sc"><div class="g" style="grid-template-columns:'+LW+'px repeat('+nc+',minmax(0,1fr))"><div></div>';
 for(let i=ws;i<=we;){const k=days[i].getFullYear()*12+days[i].getMonth();let j=i;while(j+1<=we&&days[j+1].getFullYear()*12+days[j+1].getMonth()===k)j++;

 h+='<div class="sub">Kegiatan & tanggal</div>';
 for(let k=ws;k<=we;k++)h+='<div class="dn'+(hi[k]?' a':'')+(k===today?' t':'')+'" style="'+(hi[k]?'background:'+hi[k]+'33;border-radius:4px':'')+'">'+(zoom?'<small>'+DS[days[k].getDay()]+'</small>':'')+'<span>'+(!dense||days[k].getDay()===1?days[k].getDate():'')+'</span></div>';
 vp.forEach(p=>{const pi=S.ph.indexOf(p);
  h+='<div class="ph" style="grid-column:1/-1"><span class="dot" style="background:'+p.c+'"></span>'+ROM[pi]+'. '+(edit?'<input data-f="pt" data-p="'+p.id+'" value="'+at(p.t)+'" style="width:240px"><button data-a="adda" data-v="'+p.id+'">+ Kegiatan</button><button data-a="delp" data-v="'+p.id+'" class="'+(pend=='p'+p.id?'dg':'')+'">'+(pend=='p'+p.id?'Yakin hapus tahap?':'Hapus tahap')+'</button>':esc(p.t)+(p.acts.length?'':' <span class="sub">(belum ada kegiatan)</span>'))+'</div>';
  p.acts.forEach(a=>{const dm=focus!==null&&focus!==a.id;
   h+='<div class="l'+(focus===a.id?' s':'')+(dm?' d':'')+'" data-r="'+a.id+'">'+(edit?'<div class="row" style="flex-wrap:nowrap"><input data-f="nm" data-r="'+a.id+'" value="'+at(a.name)+'" style="flex:1;min-width:0"><button data-a="del" data-v="'+a.id+'" class="'+(pend=='a'+a.id?'dg':'')+'" aria-label="Hapus kegiatan">'+(pend=='a'+a.id?'Yakin?':'Hapus')+'</button></div><div class="row" style="flex-wrap:nowrap;margin-top:3px"><input type="date" data-f="sd" data-r="'+a.id+'" value="'+a.sd+'" style="flex:1;min-width:0"><span>–</span><input type="date" data-f="ed" data-r="'+a.id+'" value="'+a.ed+'" style="flex:1;min-width:0"></div>':esc(a.name)+'<small><span class="dot" style="background:'+STC[a.st]+'"></span>'+rng(a)+' · '+STN[a.st]+'</small>')+'</div>';
   for(let k=ws;k<=we;k++){const inr=k>=a.s&&k<=a.e;
    h+='<div class="c'+(k===today?' t':'')+'" data-r="'+a.id+'" title="'+full(days[k])+(inr?' – '+at(a.name):'')+'" style="'+(inr?'background:'+p.c+';opacity:'+((a.st?1:.6)*(dm?.3:1)):'')+'">'+(inr&&a.st==2&&k===a.e?'✓':'')+'</div>'}})});
 if(vis.length&&(!f||we===n-1)){h+='<div class="ph" style="color:var(--rd)">Akhir rangkaian</div>';for(let k=ws;k<=we;k++)h+='<div class="c" title="'+full(days[k])+'" style="min-height:26px;margin-top:10px;'+(k===n-1?'background:#E24B4A':'border-color:transparent')+'"></div>'}
 h+='</div></div>';
 h+='<div id="pn">';
 if(!f)h+='<span class="sub">Klik nama kegiatan atau kotaknya untuk memfokuskan timeline dan mengubah statusnya.</span>';
 else{const a=f.a;h+='<div class="row" style="justify-content:space-between"><b>'+esc(a.name)+'</b><button data-a="close">Lihat semua</button></div><div class="kv"><span>Tahap</span><span>'+ROM[S.ph.indexOf(f.p)]+'. '+esc(f.p.t)+'</span><span>Tanggal</span><span>'+full(D(a.sd))+(a.sd!==a.ed?' – '+full(D(a.ed)):'')+'</span><span>Durasi</span><span>'+(a.e-a.s+1)+' hari kerja</span><span>Pelaksana</span>'+(edit?'<input data-f="who" value="'+at(a.who)+'">':'<span>'+esc(a.who||'–')+'</span>')+'<span>Output</span>'+(edit?'<input data-f="out" value="'+at(a.out)+'">':'<span>'+esc(a.out||'–')+'</span>')+'</div><div class="row"><span class="sub">Status</span>'+(canEdit()?STN.map((s,k)=>'<button data-a="st" data-v="'+k+'" class="'+(a.st===k?'on':'')+'">'+s+'</button>').join(''):'<b>'+STN[a.st]+'</b>')+'</div>'}
 document.getElementById('app').innerHTML=h+'</div>'}
function snap(s,isEnd){const d=D(s),w=d.getDay();if(w==6||w==0){d.setDate(d.getDate()+(isEnd?(w==6?-1:-2):(w==6?2:1)));return iso(d)}return s}
document.getElementById('app').addEventListener('click',e=>{const t=e.target,b=t.closest('[data-a]');let rr=false;
 const act=b&&b.dataset.a,v=b&&b.dataset.v,key=act=='del'?'a'+v:act=='delp'?'p'+v:act=='reset'?'reset':null;
